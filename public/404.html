<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect
      var l = window.location;
      var repo = "/Reactive-Physio-Clinic";
      l.replace(
        l.protocol +
          "//" +
          l.host +
          repo +
          "/?p=" +
          encodeURIComponent(l.pathname.replace(repo, "")) +
          (l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
